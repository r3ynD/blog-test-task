services:
  test:
    extends:
      file: compose.yaml
      service: php
    environment:
      DB_HOST: mysql_test
      DB_NAME: blog_test
      SEED_ADMIN_PASSWORD: test-admin-password
      SEED_WRITER_PASSWORD: test-writer-password
      SEED_READER_PASSWORD: test-reader-password
    volumes:
      - .:/var/www/html
      - smarty_compile:/var/www/html/var/templates_c
      - uploads_test:/var/www/html/public/uploads
    depends_on:
      mysql_test:
        condition: service_healthy
      nginx_test:
        condition: service_started
    command:
      - sh
      - -c
      - >
        php -d zend.assertions=1 -d assert.exception=1 tests/database.php
        && php -d zend.assertions=1 -d assert.exception=1 tests/home.php
        && php -d zend.assertions=1 -d assert.exception=1 tests/application.php
        && php -d zend.assertions=1 -d assert.exception=1 tests/filters.php
        && php -d zend.assertions=1 -d assert.exception=1 tests/views.php
        && php -d zend.assertions=1 -d assert.exception=1 tests/http.php
        && sh tests/smoke.sh http://nginx_test

  php_test:
    extends:
      file: compose.yaml
      service: php
    environment:
      DB_HOST: mysql_test
      DB_NAME: blog_test
    volumes:
      - .:/var/www/html
      - smarty_compile:/var/www/html/var/templates_c
      - uploads_test:/var/www/html/public/uploads
    depends_on:
      mysql_test:
        condition: service_healthy

  nginx_test:
    image: nginx:stable-alpine
    environment:
      PHP_FPM_HOST: php_test
      NGINX_ENVSUBST_FILTER: '^PHP_FPM_HOST$$'
    volumes:
      - ./public:/var/www/html/public:ro
      - uploads_test:/var/www/html/public/uploads:ro
      - ./docker/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      - php_test

  mysql_test:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: blog_test
      MYSQL_USER: ${MYSQL_USER:-blog}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysql -h 127.0.0.1 -u root -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  uploads_test:
